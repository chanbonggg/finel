spring:
  # Docker Compose supplies these values as container environment variables.
  # Keep this profile separate from devdb so local .env loading remains a
  # deliberate development-only choice.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
