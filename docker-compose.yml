services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - finel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finel-internal

  finel-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: devdb
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_ORIGIN: ${PUBLIC_SITE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-finel/products}
      NEXT_REVALIDATE_URL: http://finel-frontend:3000/internal/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    networks:
      - finel-internal

  finel-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        SERVER_API_BASE_URL: http://finel-backend:8080
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      - finel-backend
    environment:
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SERVER_API_BASE_URL: http://finel-backend:8080
    networks:
      - finel-internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - finel-frontend
      - finel-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/finel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/acme-challenge:/var/www/acme-challenge:ro
    networks:
      - finel-internal

networks:
  finel-internal:
    driver: bridge

volumes:
  finel-postgres-data:
