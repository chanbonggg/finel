services:
    postgres:
      image: postgres:18-alpine
      restart: unless-stopped
      environment:
        POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
        POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      volumes:
        # PostgreSQL 18 stores its versioned cluster below this directory.
        # Mounting the old /data path causes the official image to refuse startup.
        - finel-postgres-18-data:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s
      networks:
        - finel-internal

    finel-backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        SPRING_PROFILES_ACTIVE: db
        CATALOG_STORAGE_ROOT: /var/lib/finel/catalogs
        SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:?SPRING_FLYWAY_ENABLED must be set}
        DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
        DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
        DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
        FRONTEND_ORIGIN: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL must be set}
        JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
        AUTH_COOKIE_SECURE: "true"
        AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
        ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
        ADMIN_USERNAME: ${ADMIN_USERNAME:-}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
        MAIL_USERNAME: ${MAIL_USERNAME:-}
        MAIL_PASSWORD: ${MAIL_PASSWORD:-}
        MAIL_FROM: ${MAIL_FROM:-}
        MAIL_TO: ${MAIL_TO:-}
        MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
        MAIL_PORT: ${MAIL_PORT:-587}
        CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
        CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
        CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
        CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-finel/products}
        NEXT_REVALIDATE_URL: http://finel-frontend:3000/internal/revalidate
        REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET must be set}
      networks:
        - finel-internal

      volumes:
        - finel-catalog-data:/var/lib/finel/catalogs

    finel-frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          NEXT_PUBLIC_API_BASE_URL: /api
          SERVER_API_BASE_URL: http://finel-backend:8080
          NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL must be set}
      restart: unless-stopped
      depends_on:
        - finel-backend
      environment:
        REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET must be set}
        SERVER_API_BASE_URL: http://finel-backend:8080
      networks:
        - finel-internal

    nginx:
      image: nginx:1.27-alpine
      restart: unless-stopped
      depends_on:
        - finel-frontend
        - finel-backend
      ports:
        # Cloudflare Tunnel is the public HTTPS endpoint; expose only its local origin.
        - "127.0.0.1:8081:80"
      volumes:
        - ./nginx/conf.d/finel.tunnel.conf:/etc/nginx/conf.d/default.conf:ro
      networks:
        - finel-internal

networks:
  finel-internal:
    driver: bridge

volumes:
  # PostgreSQL 18 must initialize a new cluster. Never mount a volume created
  # by PostgreSQL 16 here; migrate it with pg_dump/pg_restore instead.
  finel-postgres-18-data:
  finel-catalog-data:
